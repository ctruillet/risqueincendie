# Environnement de DÉVELOPPEMENT, sans .env :
#   - le site (même image qu'en production) ;
#   - un Keycloak qui simule l'Intranet SGDF (comptes de test dans keycloak/sgdf_local-realm.json) ;
#   - Mailpit, une boîte mail de test qui reçoit tous les mails envoyés.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
#   Site            http://localhost:3000   (comptes 100000001, 100000002, 100000003 ; mot de passe « chef »)
#   Mails reçus     http://localhost:8025
#   Admin Keycloak  http://localhost:8180   (admin / admin)
name: ne-dev

services:
  site:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      COOKIE_SECURE: "0"
      INTRANET_URL: http://keycloak:8080
      INTRANET_REALM: sgdf_local
      INTRANET_CLIENT_ID: ne-local
      INTRANET_CLIENT_SECRET: secret-de-developpement-local # gitleaks:allow (Keycloak local uniquement)
      SUPER_ADMINS: "100000001"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "0"
      MAIL_FROM: "Prévisions des Massifs <notifications@example.org>"
    volumes:
      - data:/data
    depends_on:
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin # gitleaks:allow (Keycloak local uniquement)
    volumes:
      - ./keycloak/sgdf_local-realm.json:/opt/keycloak/data/import/sgdf_local-realm.json:ro
    healthcheck:
      # Pas de curl dans l'image Keycloak : requête HTTP minimale avec bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  data:

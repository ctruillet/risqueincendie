# Exemple de bloc serveur nginx (sur la machine hôte) pour servir le site en HTTPS.
# À adapter (domaine, certificats, port = PORT du fichier .env), puis recharger nginx.
# Le HTTPS est indispensable : le cookie de connexion à l'admin n'est envoyé qu'en HTTPS.

server {
    listen 80;
    server_name massifs.example.fr;
    return 301 https://$host$request_uri;
}

server {
    # nginx < 1.25 : remplacer les deux lignes par « listen 443 ssl http2; »
    listen 443 ssl;
    http2 on;
    server_name massifs.example.fr;

    ssl_certificate     /etc/letsencrypt/live/massifs.example.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massifs.example.fr/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # « Vérifier les prévisions maintenant » peut prendre quelques secondes
        proxy_read_timeout 60s;
    }
}

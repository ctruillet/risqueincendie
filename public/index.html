<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prévisions des massifs – Nature Environnement</title>
    <meta name="description" content="Accès aux massifs forestiers (risque incendie) aujourd'hui et demain pour les camps Nature Environnement : Bouches-du-Rhône, Var, Hérault, Gard et autres départements.">
    <link rel="stylesheet" href="ui/sgdf.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#003a5d">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

    <header class="barre">
        <a href="./" class="marque"><img src="logo.svg" alt="" width="35" height="32">Nature Environnement</a>
        <nav id="compte" class="compte" aria-label="Compte">
            <a href="connexion" class="bouton-barre">Se connecter</a>
        </nav>
    </header>

    <main class="container">
        <div class="titre-page">
            <p class="surtitre">Camps Nature Environnement</p>
            <h1>Prévisions des massifs</h1>
            <p class="chapeau">Accès aux massifs forestiers aujourd'hui et demain, selon les préfectures.</p>
        </div>
        <p id="status-line" class="status-line" role="status"></p>
        <div id="dashboard-container" class="camps">
            <p class="loading">Chargement des camps…</p>
        </div>
    </main>

    <!-- Abonnement à un camp (personne connectée) : fenêtre native, rien d'autre à charger -->
    <dialog id="abonnement" class="fenetre" aria-labelledby="abonnement-titre">
        <form method="dialog">
            <div class="fenetre-entete">
                <h2 id="abonnement-titre"></h2>
                <button value="annuler" class="fenetre-fermer" aria-label="Fermer">×</button>
            </div>
            <p>Chaque soir du camp, un mail avec les accès aux massifs du lendemain.</p>
            <label class="champ">Jusqu'au (facultatif)
                <input type="date" id="abonnement-date">
            </label>
            <p id="abonnement-aide" class="aide-dialog"></p>
            <div class="fenetre-actions">
                <button value="retirer" id="abonnement-retirer" class="bouton bouton-texte" hidden>Me désabonner</button>
                <button value="annuler" class="bouton bouton-secondaire">Annuler</button>
                <button value="ok" id="abonnement-ok" class="bouton">M'abonner</button>
            </div>
        </form>
    </dialog>
    <p id="notification" class="notification" role="status" hidden></p>

    <!-- pied-de-page -->

    <script src="js/common.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>

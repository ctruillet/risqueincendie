# Site, admin, relevé des prévisions et envoi des mails dans un seul conteneur.
# Réglages dans .env (voir .env.example). Les données sont dans le volume « data ».
# Le site écoute sur 127.0.0.1:<PORT> : placer devant un reverse proxy HTTPS (voir docker/nginx-site.conf).
services:
  risquemassif:
    build: .
    image: risquemassif
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - data:/data
      # Pied de page et pages obligatoires : modifiables sur le serveur, pris en compte à l'enregistrement
      - ./contenu:/app/contenu:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
